<!doctype html>
<html lang="en" class="anim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="description" content="Orbit — Secure system">
<title>Orbit — Secure system</title>
<style>
:root{--ink:#ffffff;--surface:#161616;--orb-reveal:cubic-bezier(.16,1,.3,1);--orb-soft:cubic-bezier(.25,.8,.28,1)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#161616}
body{font-family:"Orbit Sans",Arial,Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@font-face{font-family:"Orbit Sans";src:local("Arial");font-style:normal;font-weight:400;font-display:block}
@font-face{font-family:"Orbit Display";src:local("Times New Roman");font-style:normal;font-weight:400;font-display:block}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.viewport{position:fixed;inset:0;background:var(--surface);overflow:hidden}
.stage{position:absolute;inset:0;contain:strict;isolation:isolate;background:var(--surface);overflow:hidden}
.brand-mark{position:absolute;z-index:1;top:2.141745dvh;left:3.854167vw;width:clamp(34px,min(3.4375vw,5.2dvh),66px);height:auto;display:block}
.brand-mark line{stroke:#fff;stroke-width:5;stroke-linecap:square}
.primary-nav{position:absolute;inset:0;z-index:4;pointer-events:none}
.primary-nav a{position:absolute;top:3.426791dvh;font-size:clamp(13px,min(1.302083vw,2.05dvh),25px);line-height:1;white-space:nowrap;pointer-events:auto;font-weight:400}
.primary-nav a:nth-child(1){left:10.104167vw;transform:scaleX(1.165);transform-origin:left center}
.primary-nav a:nth-child(2){left:17.526042vw;transform:scaleX(1.052);transform-origin:left center}
.primary-nav a:nth-child(3){left:27.578125vw;transform:scaleX(1.126);transform-origin:left center}
.primary-nav a:nth-child(4){left:36.171875vw;transform:scaleX(1.168);transform-origin:left center}
.system-pill{position:absolute;z-index:4;top:2.336449dvh;right:7.5vw;height:clamp(34px,4.439252dvh,57px);padding:0 clamp(17px,2vw,32px);border-radius:999px;background:#fff;color:#161616;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.05vw,18px);letter-spacing:.026923em;white-space:nowrap}
.orbit-word{position:absolute;z-index:1;top:11.565421dvh;left:4.348958vw;margin:0;font-family:"Orbit Display","Times New Roman",Times,serif;font-size:min(27.8125vw,55dvh);font-weight:400;line-height:.9;letter-spacing:.033708em;white-space:nowrap}
.orbit-word__mask{display:block;overflow:hidden;padding:0 .04em .12em 0;margin:0 -.04em -.12em 0}
.orbit-word__inner{display:inline-flex;align-items:baseline;transform:translateY(0)}
.orbit-word__white{color:#fff;display:inline-flex;align-items:baseline}
.orbit-word__o{display:inline-block;transform:scaleX(1.0866);transform-origin:left center;margin-right:.042135em}
.orbit-word__pink{background:linear-gradient(180deg,#ffc5dc 0%,#fd86db 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.flower{position:absolute;z-index:2;top:14.749065dvh;left:49.121328vw;height:106.109034dvh;width:auto;transform:translateX(-50%);pointer-events:none}
.flower__sizer{display:block;visibility:hidden;height:100%;width:auto}
.flower__layer{position:absolute;inset:0;width:100%;height:100%}
.flower__layer img{display:block;width:100%;height:100%;object-fit:cover}
.flower__layer--bg{z-index:1}
.flower__layer--top{z-index:2;mask-image:linear-gradient(#0000,#0000);-webkit-mask-image:linear-gradient(#0000,#0000);mask-size:100% 100%;-webkit-mask-size:100% 100%;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat}
.support-copy{position:absolute;z-index:3;bottom:4.361371dvh;margin:0;color:#f7f7f7;font-size:clamp(14px,min(1.40625vw,2.102804dvh),27px);line-height:1.32;font-weight:400;white-space:nowrap}
.support-copy--left{left:3.177083vw;transform:scaleX(1.073);transform-origin:left bottom}
.support-copy--right{left:78.28125vw;transform:scaleX(1.058);transform-origin:left bottom}
.support-copy__inner{display:block}
.mobile-burger,.mobile-scrim,.mobile-sheet{display:none}
html.anim .brand-mark{animation:orb-quiet 620ms var(--orb-soft) 100ms both}
html.anim .primary-nav a:nth-child(1){animation:orb-dim 550ms var(--orb-soft) 180ms both}
html.anim .primary-nav a:nth-child(2){animation:orb-dim 550ms var(--orb-soft) 225ms both}
html.anim .primary-nav a:nth-child(3){animation:orb-dim 550ms var(--orb-soft) 270ms both}
html.anim .primary-nav a:nth-child(4){animation:orb-dim 550ms var(--orb-soft) 315ms both}
html.anim .system-pill{animation:orb-quiet 620ms var(--orb-soft) 340ms both}
html.anim .orbit-word__inner{animation:orb-word 1150ms var(--orb-reveal) 300ms both}
html.anim .flower{animation:orb-subject 1150ms var(--orb-reveal) 660ms both}
html.anim .support-copy__inner{animation:orb-corner 720ms var(--orb-soft) 980ms both}
@keyframes orb-word{from{transform:translateY(118%)}to{transform:translateY(0)}}
@keyframes orb-subject{from{opacity:0;transform:translateX(-50%) translateY(3.4dvh)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes orb-corner{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@keyframes orb-quiet{from{opacity:0;translate:0 5px}to{opacity:1;translate:0 0}}
@keyframes orb-dim{from{opacity:0}to{opacity:1}}
@media(max-width:1200px),(max-aspect-ratio:4/5){.orbit-word{left:0;width:100%;text-align:center}}
@media(max-width:900px),(max-aspect-ratio:4/5){
 .primary-nav,.system-pill{display:none}
 .mobile-burger{display:flex;position:absolute;z-index:12;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#161616;align-items:center;justify-content:center;cursor:pointer}
 .mobile-burger svg{width:23px;height:23px}
 .mobile-scrim{display:block;position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s var(--orb-soft),visibility .35s}
 .mobile-sheet{display:flex;position:absolute;z-index:10;top:12px;right:12px;bottom:12px;width:min(390px,calc(100% - 24px));padding:28px;border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(29,29,29,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-direction:column;transform:translateX(calc(100% + 20px));transition:transform .5s var(--orb-reveal);box-shadow:0 20px 80px #0008}
 .mobile-sheet__top{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
 .mobile-close{width:40px;height:40px;border:1px solid #555;border-radius:50%;background:transparent;color:#fff;font-size:22px;cursor:pointer}
 .mobile-links{display:flex;flex-direction:column;gap:0;margin-top:34px}
 .mobile-links a{padding:17px 0;border-bottom:1px solid #ffffff20;font-size:clamp(20px,5vw,28px)}
 .mobile-sheet__foot{margin-top:auto;color:#aaa;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
 .stage.menu-open .mobile-scrim{opacity:1;visibility:visible}
 .stage.menu-open .mobile-sheet{transform:translateX(0)}
 .stage.menu-open .mobile-burger{opacity:0;pointer-events:none}
}
@media(max-aspect-ratio:4/5){
 .brand-mark{top:max(20px,env(safe-area-inset-top));left:22px;width:38px}
 .orbit-word{top:29dvh;font-size:min(27.5vw,18dvh);letter-spacing:.025em}
 .flower{top:24dvh;left:50%;height:min(55dvh,110vw)}
 .support-copy{bottom:calc(3.5dvh + env(safe-area-inset-bottom));white-space:normal;max-width:42vw;font-size:clamp(12px,3vw,17px);line-height:1.35}
 .support-copy--left{left:6vw}
 .support-copy--right{left:auto;right:6vw;text-align:right}
}
@media(prefers-reduced-motion:reduce){
 html.anim .stage{animation:orb-dim 280ms ease both}
 html.anim .brand-mark,html.anim .primary-nav a,html.anim .system-pill,html.anim .orbit-word__inner,html.anim .flower,html.anim .support-copy__inner{animation:none!important}
 .mobile-scrim,.mobile-sheet{transition:none}
}
</style>
</head>
<body>
<main class="viewport">
<section class="stage" id="stage" aria-label="Orbit secure system poster">
<svg class="brand-mark" viewBox="0 0 66 62" aria-hidden="true"><line x1="33" y1="1" x2="33" y2="61"/><line x1="3" y1="31" x2="63" y2="31"/><line x1="11.8" y1="9.8" x2="54.2" y2="52.2"/><line x1="54.2" y1="9.8" x2="11.8" y2="52.2"/></svg>
<nav class="primary-nav" aria-label="Primary navigation">
<a href="#home">Home</a><a href="#resources">Resources</a><a href="#benefits">Benefits</a><a href="#contact">Contact</a>
</nav>
<div class="system-pill">Secure system</div>
<h1 class="orbit-word" id="orbit-title" aria-label="Orbit"><span class="orbit-word__mask"><span class="orbit-word__inner"><span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span><span class="orbit-word__pink">BIT</span></span></span></h1>
<div class="flower" id="flower">
<img class="flower__sizer" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="" aria-hidden="true">
<div class="flower__layer flower__layer--bg" id="front-layer"><img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="Pixel-art pink and violet lily"></div>
<div class="flower__layer flower__layer--top" id="reveal-layer" aria-hidden="true"><img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt=""></div>
</div>
<p class="support-copy support-copy--left"><span class="support-copy__inner">Every workflow,<br>intelligently connected.</span></p>
<p class="support-copy support-copy--right"><span class="support-copy__inner">Less manual work.<br>More meaningful output.</span></p>
<button class="mobile-burger" id="menu-open" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button class="mobile-scrim" id="menu-scrim" type="button" aria-label="Close menu" tabindex="-1"></button>
<aside class="mobile-sheet" id="mobile-menu" aria-label="Mobile navigation" inert>
<div class="mobile-sheet__top"><span>Orbit / Menu</span><button class="mobile-close" id="menu-close" type="button" aria-label="Close menu">×</button></div>
<nav class="mobile-links"><a href="#home">Home</a><a href="#resources">Resources</a><a href="#benefits">Benefits</a><a href="#contact">Contact</a></nav>
<div class="mobile-sheet__foot">Secure system · Orbit</div>
</aside>
</section>
</main>
<script>
(()=>{
const stage=document.getElementById('stage'), flower=document.getElementById('flower');
const front=document.getElementById('front-layer'), reveal=document.getElementById('reveal-layer');
const TRAIL_MAX_POINTS=60,TRAIL_HEAD_R=140,TRAIL_NOISE_AMP=44,TRAIL_BLOB_PTS=24,TRAIL_FADE_SPEED=.92,TRAIL_SAMPLE_DIST=8;
const makeCanvas=()=>{const c=document.createElement('canvas');c.style.display='none';document.body.appendChild(c);return c};
class MorphTrailLayer{
 constructor(layer,invert){this.layer=layer;this.invert=invert;this.canvas=makeCanvas();this.ctx=this.canvas.getContext('2d');this.points=[];this.maskUrl='';}
 resize(w,h){const dpr=1;this.canvas.width=Math.max(1,Math.round(w*dpr));this.canvas.height=Math.max(1,Math.round(h*dpr));this.ctx.setTransform(dpr,0,0,dpr,0,0);this.w=w;this.h=h;}
 draw(time){
 const c=this.ctx;c.clearRect(0,0,this.w,this.h);
 if(!this.invert){c.fillStyle='#fff';c.fillRect(0,0,this.w,this.h);c.globalCompositeOperation='destination-out';}
 else c.globalCompositeOperation='source-over';
 for(const p of this.points){c.globalAlpha=p.alpha;c.fillStyle='#fff';drawMorphBlob(c,p.x,p.y,p.r,time,p.seed)}
 c.globalAlpha=1;c.globalCompositeOperation='source-over';
 this.layer.style.maskImage='url('+this.canvas.toDataURL('image/png')+')';this.layer.style.webkitMaskImage='url('+this.canvas.toDataURL('image/png')+')';
 }
}
function drawMorphBlob(ctx,cx,cy,r,t,seed){
 if(r<2)return;const pts=[];
 for(let i=0;i<TRAIL_BLOB_PTS;i++){const a=i/ TRAIL_BLOB_PTS*Math.PI*2;
 const n1=Math.sin(a*3+t*1.4+seed)*.45,n2=Math.sin(a*5-t*.9+seed*2.3)*.3,n3=Math.cos(a*2+t*1.8+seed*.7)*.25;
 const noise=(n1+n2+n3)*TRAIL_NOISE_AMP*(r/TRAIL_HEAD_R),rr=Math.max(0,r+noise);pts.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr});}
 ctx.beginPath();
 for(let i=0;i<pts.length;i++){const p=pts[i],next=pts[(i+1)%pts.length],mx=(p.x+next.x)/2,my=(p.y+next.y)/2;if(i===0)ctx.moveTo(mx,my);ctx.quadraticCurveTo(p.x,p.y,mx,my);}
 ctx.closePath();ctx.fill();
}
const frontTrail=new MorphTrailLayer(front,false),revealTrail=new MorphTrailLayer(reveal,true);
let hovering=false,headRadius=0,time=0,lastSample=null,raf=0;
function resize(){const r=flower.getBoundingClientRect();frontTrail.resize(r.width,r.height);revealTrail.resize(r.width,r.height);frontTrail.draw(time);revealTrail.draw(time)}
function onPointer(e){const r=flower.getBoundingClientRect();const x=(e.clientX-r.left)*(frontTrail.w/r.width),y=(e.clientY-r.top)*(frontTrail.h/r.height);
if(hovering&&headRadius>5){if(!lastSample||Math.hypot(x-lastSample.x,y-lastSample.y)>TRAIL_SAMPLE_DIST){const p={x,y,r:headRadius,alpha:1,seed:Math.random()*100};frontTrail.points.push({...p});revealTrail.points.push({...p});lastSample={x,y};while(frontTrail.points.length>TRAIL_MAX_POINTS)frontTrail.points.shift();while(revealTrail.points.length>TRAIL_MAX_POINTS)revealTrail.points.shift();}}
}
stage.addEventListener('mouseenter',()=>{hovering=true});
stage.addEventListener('mouseleave',()=>{hovering=false;lastSample=null});
stage.addEventListener('mousemove',onPointer);
function frame(){headRadius+=( (hovering?TRAIL_HEAD_R:0)-headRadius)*(hovering?.14:.04);
time+=.016;
for(const trail of [frontTrail,revealTrail]){trail.points.forEach(p=>{p.alpha*=TRAIL_FADE_SPEED;p.r*=.995});trail.points=trail.points.filter(p=>p.alpha>=.01);}
frontTrail.draw(time);revealTrail.draw(time);raf=requestAnimationFrame(frame)}
function menu(open){stage.classList.toggle('menu-open',open);document.getElementById('menu-open').setAttribute('aria-expanded',String(open));document.getElementById('mobile-menu').inert=!open;if(open){document.getElementById('mobile-menu').removeAttribute('inert');document.getElementById('menu-close').focus()}else{document.getElementById('mobile-menu').setAttribute('inert','');document.getElementById('menu-open').focus()}}
document.getElementById('menu-open').addEventListener('click',()=>menu(true));document.getElementById('menu-close').addEventListener('click',()=>menu(false));document.getElementById('menu-scrim').addEventListener('click',()=>menu(false));
document.querySelectorAll('.mobile-links a').forEach(a=>a.addEventListener('click',()=>menu(false)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('menu-open'))menu(false);if(e.key==='Tab'&&stage.classList.contains('menu-open')){const focusables=[...document.querySelectorAll('#mobile-menu a,#menu-close')],first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const imgs=[...flower.querySelectorAll('img')];let loaded=0;const ready=()=>{loaded++;if(loaded>=imgs.length)resize()};imgs.forEach(img=>{if(img.complete)ready();else{img.addEventListener('load',ready,{once:true});img.addEventListener('error',ready,{once:true})}});
window.addEventListener('resize',resize,{passive:true});if('ResizeObserver'in window)new ResizeObserver(resize).observe(flower);
requestAnimationFrame(frame);
const finish=()=>document.documentElement.classList.remove('anim');document.querySelector('.orbit-word__inner').addEventListener('animationend',finish,{once:true});setTimeout(finish,6000);
})();
</script>
</body>
</html>
